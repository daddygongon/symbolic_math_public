<!DOCTYPE html>
<html>
<head>
  <title>Canvas Links</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href=".theme.css">
</head>
<body style="background-color: var(--background);">

<canvas id="myCanvas" width="1200" height="800" style="border:1px solid var(--border); cursor:pointer;"></canvas>

<script>
const canvas = document.getElementById('myCanvas');
const ctx = canvas.getContext('2d');
const computedStyle = getComputedStyle(document.documentElement);

// --- 高DPI対応 ---
const dpr = window.devicePixelRatio || 1;
const rect = canvas.getBoundingClientRect();
canvas.width = rect.width * dpr;
canvas.height = rect.height * dpr;
ctx.scale(dpr, dpr);
canvas.style.width = rect.width + 'px';
canvas.style.height = rect.height + 'px';
// --- ここまで ---

ctx.imageSmoothingQuality = 'high'; // 画像の描画品質を最高に設定

// 1. データ定義（Rubyで生成）
const nodes = [
  {
    "id": 10,
    "name": "d7 過去問",
    "type": "icon",
    "file_path": "d7_old_exams/readme.html",
    "icon_path": "d7_old_exams/dummy_icon.png",
    "x": 720,
    "y": 524,
    "color": "green",
    "fixed": true
  },
  {
    "id": 9,
    "name": "d7 数式変形-II",
    "type": "icon",
    "file_path": "d7_eq_manip_2/readme.html",
    "icon_path": "d7_eq_mainp_2/dummy_icon.png",
    "x": 686,
    "y": 401,
    "color": "green",
    "fixed": true
  },
  {
    "id": 8,
    "name": "d6 数式変形-I",
    "type": "icon",
    "file_path": "d6_eq_manip/readme.html",
    "icon_path": "d6_eq_manip/dummy_icon.png",
    "x": 524,
    "y": 387,
    "color": "green",
    "fixed": true
  },
  {
    "id": 7,
    "name": "d5 1020 la_basic",
    "type": "icon",
    "file_path": "d5_la_basic/readme.html",
    "icon_path": "d5_la_basic/draw_four_spaces.004.png",
    "x": 683,
    "y": 242,
    "color": "green",
    "fixed": true
  },
  {
    "id": 6,
    "name": "d4 1013 la_breast_cancer",
    "type": "icon",
    "file_path": "d4_la_breast_cancer/readme.html",
    "icon_path": "d4_la_breast_cancer/dummy_icon.png",
    "x": 510,
    "y": 242,
    "color": "green",
    "fixed": true
  },
  {
    "id": 5,
    "name": "d3 1006 微積分",
    "type": "icon",
    "file_path": "d3_diff_int/readme.html",
    "icon_path": "d3_diff_int/d3_diff_int_head.png",
    "x": 663,
    "y": 85,
    "color": "green",
    "fixed": true
  },
  {
    "id": 4,
    "name": "d2_0929 対数",
    "type": "icon",
    "file_path": "d2_log/readme.html",
    "icon_path": "d2_log/d2_log_head.png",
    "x": 532,
    "y": 87,
    "color": "green",
    "fixed": true
  },
  {
    "id": 3,
    "name": "d1_0922 initial",
    "type": "icon",
    "file_path": "d1_init/readme.html",
    "icon_path": "d1_init/d1_init.001.png",
    "x": 186,
    "y": 147,
    "color": "green",
    "fixed": true
  },
  {
    "id": 2,
    "name": "アナウンス, link",
    "type": "icon",
    "file_path": "d0_anounce/readme.html",
    "icon_path": "d0_anounce/dummy_icon.png",
    "x": 143,
    "y": 233,
    "color": "green",
    "fixed": true
  },
  {
    "id": 1,
    "name": "hyper_card/",
    "type": "dir",
    "file_path": ".",
    "icon_path": ".semi_lattice/icons/folder.png",
    "x": 322,
    "y": 276,
    "color": "green",
    "fixed": true
  }
];
const edges = [
  {
    "from": 1,
    "to": 2
  },
  {
    "from": 1,
    "to": 3
  },
  {
    "from": 1,
    "to": 4
  },
  {
    "from": 4,
    "to": 5
  },
  {
    "from": 1,
    "to": 6
  },
  {
    "from": 6,
    "to": 7
  },
  {
    "from": 1,
    "to": 8
  },
  {
    "from": 8,
    "to": 9
  },
  {
    "from": 9,
    "to": 10
  }
];

// ノードIDをキーにしたノード情報のマップを作成
const nodeMap = new Map(nodes.map(node => [node.id, node]));

const nodesWithIcons = nodes.filter(node => node.icon_path);
const defaultIconWidth = 120;
const defaultIconHeight = 90;

// 画像を読み込めない場合にもラベルとクリック領域を残す
nodes.forEach(node => {
  node.width = defaultIconWidth;
  node.height = defaultIconHeight;
  node.img = null;
  node.imageLoadError = false;
});

// 描画関数
function drawAll() {
  // Canvasをクリア
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 背景色を設定
  ctx.fillStyle = computedStyle.getPropertyValue('--background').trim();
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 2. エッジ（線）を描画
  ctx.strokeStyle = computedStyle.getPropertyValue('--foreground').trim();
  ctx.lineWidth = 1;
  edges.forEach(edge => {
    const fromNode = nodeMap.get(edge.from);
    const toNode = nodeMap.get(edge.to);
    if (fromNode && toNode) {
      ctx.beginPath();
      ctx.moveTo(fromNode.x, fromNode.y);
      ctx.lineTo(toNode.x, toNode.y);
      ctx.stroke();
    }
  });

  // 3. ノード（アイコンとテキスト）を描画
  nodes.forEach(node => {
    // 描画位置を画像の中心に補正
    const drawX = node.x - node.width / 2;
    const drawY = node.y - node.height / 2;

    if (node.img && node.img.naturalWidth > 0) {
      ctx.drawImage(node.img, drawX, drawY, node.width, node.height);
    } else {
      // 画像がない場合や読み込みに失敗した場合はプレースホルダーを表示
      ctx.fillStyle = computedStyle.getPropertyValue('--muted').trim() || '#cccccc';
      ctx.strokeStyle = computedStyle.getPropertyValue('--muted-foreground').trim() || '#666666';
      ctx.fillRect(drawX, drawY, node.width, node.height);
      ctx.strokeRect(drawX, drawY, node.width, node.height);

      ctx.fillStyle = computedStyle.getPropertyValue('--muted-foreground').trim() || '#666666';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('image not found', node.x, node.y);
    }
    
    // 画像の読み込み結果にかかわらずタイトルを表示
    ctx.fillStyle = computedStyle.getPropertyValue('--muted-foreground').trim();
    ctx.font = `12px ${computedStyle.getPropertyValue('--font-family-base').trim()}`;
    ctx.textAlign = 'center';
    ctx.fillText(node.name, node.x, drawY + node.height + 15);
  });
}

// 画像の読み込み処理
function loadNodeImage(node) {
  return new Promise(resolve => {
    const img = new Image();

    img.onload = () => {
      // 元画像の縦横比を維持して高さを計算
      const aspectRatio = img.naturalHeight / img.naturalWidth;
      node.width = defaultIconWidth;
      node.height = defaultIconWidth * aspectRatio;
      node.img = img;
      resolve();
    };

    img.onerror = () => {
      node.img = null;
      node.imageLoadError = true;
      console.warn(`Icon image could not be loaded: ${node.icon_path}`, node);
      resolve();
    };

    // ハンドラを登録してから読み込みを開始する
    img.src = node.icon_path;
  });
}

// 一部の画像が読み込めなくても，全ノードの描画を継続する
Promise.all(nodesWithIcons.map(loadNodeImage)).then(drawAll);

// 4. クリックイベントの設定
canvas.addEventListener('click', (event) => {
  const rect = canvas.getBoundingClientRect();
  const clickX = event.clientX - rect.left;
  const clickY = event.clientY - rect.top;

  // クリックされたノードを逆順で探す（上に描画されたものが優先される）
  const clickedNode = nodes.slice().reverse().find(node => {
    if (!node.height || !node.file_path) return false;
    const drawX = node.x - node.width / 2;
    const drawY = node.y - node.height / 2;
    return (
      clickX >= drawX &&
      clickX <= drawX + node.width &&
      clickY >= drawY &&
      clickY <= drawY + node.height
    );
  });

  if (clickedNode) {
    window.open(clickedNode.file_path, '_blank');
  }
});
</script>

</body>
</html>
